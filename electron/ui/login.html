<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self';">
  <title>Cipher Launcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>cipher</h1>
    </div>

    <form id="activate-form">
      <div class="input-group">
        <label for="license-key">License key</label>
        <input
          type="text"
          id="license-key"
          placeholder="CIPHER-XXXX-XXXX-XXXX"
          autocomplete="off"
          spellcheck="false"
          required
        >
      </div>

      <button type="submit" id="activate-btn">
        <span class="btn-text">Activate</span>
        <span class="btn-loading" hidden>Activating...</span>
      </button>

      <p id="error-msg" class="error" hidden></p>
    </form>

    <div class="footer">
      <p id="version"></p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
